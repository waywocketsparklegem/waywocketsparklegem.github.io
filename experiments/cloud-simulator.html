<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400&amp;display=swap">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1f5fb8; /* sky blue fallback */
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* The sunset/daytime switch, in carriemarkusen.net's terminal style: a black box with a hairline white frame (0.5px) and
     JetBrains Mono Thin in lowercase, at the size of the site's status bar text. It inverts on hover. */
  #mode {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 0.6rem 1rem;
    border: 0.5px solid #fcfcfc;
    background: rgba(0, 0, 0, 0.75);  /* 75% black, so the sky shows through a little */
    color: #fcfcfc;
    font: 100 0.75rem/1.6 "JetBrains Mono", ui-monospace, Menlo, monospace;
    cursor: pointer;
  }
  #mode:hover, #mode:focus-visible { background: #fcfcfc; color: #000000; }
  #mode:focus-visible { outline: 0.5px dashed #fcfcfc; outline-offset: 3px; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: 16px system-ui, sans-serif;
    color: #fff;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<button id="mode" type="button" aria-pressed="false">[ sunset ]</button>
<div id="fallback">Your browser doesn't support WebGL, so the clouds can't render.</div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uSunset; // 0 = daytime, 1 = sunset

// --- 3D value noise: the third dimension is time, so clouds morph instead of just sliding ---
float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

// Each octave evolves through time at its own rate: large masses swell and
// dissolve slowly, fine detail only slightly faster, so shapes morph gently.
float fbm(vec2 p, float t) {
  float v = 0.0;
  float a = 0.5;
  float rate = 1.0;
  for (int i = 0; i < 6; i++) {
    v += a * noise(vec3(p, t * rate + float(i) * 13.7));
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
    rate *= 1.08;
  }
  return v;
}

// Cloud density at a point in the sky
float density(vec2 p, float t, float coverage) {
  vec2 wind = vec2(t * 0.012, t * 0.003);
  vec2 q = p + wind;
  // Domain warp gives billowy shapes; it evolves very slowly so clouds do not swirl
  vec2 warp = vec2(fbm(q * 0.5, t * 0.006 + 3.1),
                   fbm(q * 0.5 + vec2(5.2, 1.3), t * 0.006 + 7.7));
  float n = fbm(q + warp * 0.7, t * 0.04);
  return smoothstep(coverage, coverage + 0.32, n);
}

void main() {
  vec2 frag = gl_FragCoord.xy / uRes;
  vec2 p = gl_FragCoord.xy / uRes.y * 4.8;
  float t = uTime;

  float s = uSunset;

  // Daytime sky: deeper blue overhead, softer and lighter toward the horizon
  vec3 skyTop = vec3(0.07, 0.30, 0.72);
  vec3 skyBottom = vec3(0.36, 0.62, 0.92);
  vec3 daySky = mix(skyBottom, skyTop, pow(frag.y, 0.8));

  // Sunset sky: the same looking-up gradient as daytime, in deeper evening
  // blues, so switching modes keeps the same vantage point
  float y = frag.y;
  vec3 duskBottom = vec3(0.20, 0.34, 0.64);
  vec3 duskTop = vec3(0.05, 0.13, 0.38);
  vec3 duskSky = mix(duskBottom, duskTop, pow(y, 0.8));

  // The sun is setting just out of view to the lower right; its warm light
  // glows into that corner of the sky
  vec2 sunPos = vec2(0.85 * uRes.x / uRes.y, -0.25);
  vec2 sd = gl_FragCoord.xy / uRes.y - sunPos;
  float sunDist = length(vec2(sd.x * 0.6, sd.y));
  float glow = exp(-sunDist * 3.0);
  duskSky = mix(duskSky, vec3(1.0, 0.60, 0.28), glow * 0.8);
  // Orange and blue average to grey, so boost saturation where they meet
  float lum = dot(duskSky, vec3(0.299, 0.587, 0.114));
  duskSky = mix(vec3(lum), duskSky, 1.0 + 1.6 * glow * (1.0 - glow));

  vec3 sky = mix(daySky, duskSky, s);

  // Coverage breathes slowly between wispy and fuller skies
  float coverage = 0.50 + 0.06 * sin(t * 0.021) + 0.03 * sin(t * 0.053 + 1.3);

  float d = density(p, t, coverage);

  // Self-shadowing: compare with density a little way toward the sun.
  // Day and sunset are lit separately (sun upper left by day, low on the right
  // at sunset) and then cross-faded, so switching modes is a gentle dissolve
  // rather than light sweeping across the clouds.
  float litDay = 0.0;
  float litDusk = 0.0;
  if (s < 1.0) {
    float dSun = density(p + vec2(-0.6, 0.8) * 0.06, t, coverage);
    litDay = clamp(0.78 + (d - dSun) * 2.2, 0.0, 1.0);
  }
  if (s > 0.0) {
    // At sunset most of each cloud falls in shadow and only the sun-facing parts glow
    float dSun = density(p + vec2(0.35, -0.94) * 0.06, t, coverage);
    litDusk = clamp(0.48 + (d - dSun) * 3.2, 0.0, 1.0);
  }

  // Sunset clouds, graded by distance from the sun like real evening light:
  // golden closest to it, warming to peach-coral, then a soft rose farther
  // away; shadows are deep dusky blue, warming slightly near the sun
  float sunLight = exp(-sunDist * 0.9);
  float warmth = smoothstep(0.3, 0.8, sunLight);
  float nearest = smoothstep(0.6, 0.9, sunLight);
  vec3 duskLit = mix(vec3(0.96, 0.60, 0.62), vec3(1.0, 0.66, 0.46), warmth);
  duskLit = mix(duskLit, vec3(1.0, 0.74, 0.38), nearest);
  duskLit *= 0.78 + 0.22 * sunLight;
  vec3 duskShadow = mix(vec3(0.18, 0.23, 0.42), vec3(0.46, 0.32, 0.32), warmth);

  vec3 dayCloud = mix(vec3(0.62, 0.70, 0.84), vec3(1.0, 0.995, 0.98), litDay);
  vec3 duskCloud = mix(duskShadow, duskLit, litDusk);
  vec3 cloud = mix(dayCloud, duskCloud, s);

  // Bright lining on thin edges: silver by day; at sunset, sunlight shining
  // through thin edges glows gold, strongest near the sun
  float edge = smoothstep(0.0, 0.35, d) * (1.0 - smoothstep(0.35, 0.8, d));
  cloud += edge * mix(vec3(0.08), vec3(0.30, 0.17, 0.05) * sunLight, s);

  vec3 col = mix(sky, cloud, d * 0.96);

  // Gentle vignette
  vec2 v = frag - 0.5;
  col *= 1.0 - dot(v, v) * 0.18;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  const canvas = document.getElementById('sky');
  const gl = canvas.getContext('webgl');
  if (!gl) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'uRes');
  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uSunset = gl.getUniformLocation(prog, 'uSunset');

  // Sunset toggle: colors fade gently between modes over a few seconds
  const button = document.getElementById('mode');
  const FADE_SECONDS = 4;
  let sunsetTarget = 0;
  let sunsetProgress = 0;
  button.addEventListener('click', () => {
    sunsetTarget = sunsetTarget ? 0 : 1;
    button.textContent = sunsetTarget ? '[ daytime ]' : '[ sunset ]';
    button.setAttribute('aria-pressed', String(Boolean(sunsetTarget)));
  });

  // Clouds are soft, so rendering below full resolution looks the same and runs much faster
  const RENDER_SCALE = 0.8;
  function resize() {
    canvas.width = Math.max(1, Math.floor(window.innerWidth * RENDER_SCALE));
    canvas.height = Math.max(1, Math.floor(window.innerHeight * RENDER_SCALE));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  // Random start so every visit shows a different sky
  const offset = Math.random() * 1000;
  // Global speed of the whole sky (1 = original pace)
  const SPEED = 0.65;
  const start = performance.now();
  let last = start;
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    const step = dt / FADE_SECONDS;
    sunsetProgress = sunsetTarget > sunsetProgress
      ? Math.min(sunsetTarget, sunsetProgress + step)
      : Math.max(sunsetTarget, sunsetProgress - step);
    const eased = sunsetProgress * sunsetProgress * (3 - 2 * sunsetProgress);

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uSunset, eased);
    gl.uniform1f(uTime, offset + SPEED * (now - start) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
