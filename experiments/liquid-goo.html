<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #120c1c;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  /* The controls stack in the bottom right corner, screenshot above the slider, in carriemarkusen.net's
     sketchbook style: black boxes with a hairline white frame (the site's 0.5px rule), JetBrains Mono Thin in
     lowercase at the status bar's 0.75rem, a hairline for the slider and the block cursor for its handle. */
  #ui {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  #controls, #shot {
    padding: 0.35rem 0.6rem;
    border: 0.5px solid #fcfcfc;
    background: rgba(0, 0, 0, 0.75);  /* 75% black, so the film shows through a little */
    color: #fcfcfc;
    font: 100 0.75rem/1.6 "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  #shot { cursor: pointer; }
  #shot:hover, #shot:focus-visible { background: #fcfcfc; color: #000000; }
  #shot:focus-visible { outline: 0.5px dashed #fcfcfc; outline-offset: 3px; }
  #controls label { display: flex; align-items: center; gap: 0.75rem; }
  #controls input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 150px;
    height: 1.2em;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  #controls input[type=range]::-webkit-slider-runnable-track { height: 0.5px; background: #fcfcfc; }
  #controls input[type=range]::-moz-range-track { height: 0.5px; background: #fcfcfc; }
  #controls input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 0.6em;
    height: 1.1em;
    margin-top: calc(-0.55em + 0.25px);
    border: 0;
    border-radius: 0;
    background: #fcfcfc;
  }
  #controls input[type=range]::-moz-range-thumb {
    width: 0.6em;
    height: 1.1em;
    border: 0;
    border-radius: 0;
    background: #fcfcfc;
  }
  #reset {
    padding: 0 0.2rem;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #reset:hover, #reset:focus-visible { background: #fcfcfc; color: #000000; }
  #reset:focus-visible, #controls input:focus-visible { outline: 0.5px dashed #fcfcfc; outline-offset: 3px; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: 16px system-ui, sans-serif;
    color: #fff;
  }
</style>
</head>

</div>
</div>

const SATURATION = 1.7;      // punches the photo's colour up to match the film effects
const GHOST_RADIUS = 0.12;   // an unseen slow "hand" keeps the film moving on its own
const GHOST_PUSH = 0.12;
const GHOST_SPEED = 1.0;     // 1 = crosses the image in roughly 25 seconds
const MEMORY = 30;           // seconds for the goo to ease back toward its original layout (0 = never)
const HEAL = 20;             // seconds for piled-up or thinned film to settle back
const BUMP = 900.0;          // how strongly thickness slopes tilt the surface
const GLOSS = 0.35;

// ---------------------------------------------------------------- helpers
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}
const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const vs = shader(gl.VERTEX_SHADER, VERT);
function program(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\nin vec2 vUv; out vec4 o;\n' + frag));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function texture(w, h, data, filter = gl.LINEAR, internal = gl.RGBA16F, format = gl.RGBA, type = gl.FLOAT) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function target(w, h, internal = gl.RGBA16F) {
  const tex = texture(w, h, null, gl.LINEAR, internal);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}
function pingpong(w, h, internal) {
  const r = { a: target(w, h, internal), b: target(w, h, internal), w, h };
  r.swap = () => { const t = r.a; r.a = r.b; r.b = t; };
  return r;
}
// Draw `prog` into `dst` (or the screen), binding textures to units in order.
function run(prog, dst, uniforms = {}, textures = {}) {
  gl.useProgram(prog.p);
  let unit = 0;
  for (const [name, tex] of Object.entries(textures)) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(prog.u[name], unit++);
  }
  for (const [name, v] of Object.entries(uniforms)) {
    const loc = prog.u[name];
    if (loc == null) continue;
    if (typeof v === 'number') gl.uniform1f(loc, v);
    else if (v.length === 2) gl.uniform2fv(loc, v);
    else if (v.length === 3) gl.uniform3fv(loc, v);
    else gl.uniform4fv(loc, v);
  }
  if (dst) { gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb); gl.viewport(0, 0, dst.w, dst.h); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------------------------------------------------------------- programs
// Velocity is stored in velocity-grid cells per second; uv offsets are v * dt * texel.
const P = {
  // For the film (uSqueeze = 1) x holds how squeezed it is (1 = as in the photo);
  // for the original map it holds the thickness itself.
  decode: program(`
uniform sampler2D uPacked; uniform float uSqueeze;
void main() {
  vec4 c = texelFetch(uPacked, ivec2(gl_FragCoord.xy), 0);
  float t = (floor(c.r * 255.0 + 0.5) * 256.0 + floor(c.g * 255.0 + 0.5)) / 65535.0;
  o = vec4(mix(t, 1.0, uSqueeze), vUv, 1.0);   // squeeze, and where this bit of film started
}`),

  // Saturation is boosted in gamma space (closer to how we see it) before
  // converting to linear, so the photo sits alongside the vivid film colours.
  decodePhoto: program(`
uniform sampler2D uPhoto; uniform float uSat;
void main() {
  vec3 c = texelFetch(uPhoto, ivec2(gl_FragCoord.xy), 0).rgb;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  c = clamp(l + (c - l) * uSat, 0.0, 1.0);
  o = vec4(mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)), 1.0);
}`),

  advectVel: program(`
uniform sampler2D uVel; uniform vec2 uTexel; uniform float uDt;
void main() {
  vec2 v = texture(uVel, vUv).xy;
  o = vec4(texture(uVel, vUv - v * uDt * uTexel).xy, 0.0, 1.0);
}`),

  // Pointer drags nearby film along with it, and a slow wandering ghost push
  // keeps it moving when nobody's touching it; everything else eases toward
  // a slow, spatially varying back-and-forth drift instead of stopping dead.
  forces: program(`
uniform sampler2D uVel; uniform float uAspect, uRadius, uPush, uDamp, uTime, uDrift;
uniform vec2 uMouse, uMouseVel; uniform float uMouseOn;
uniform vec2 uGhost, uGhostVel; uniform float uGhostRadius, uGhostPush;
uniform sampler2D uFilm; uniform vec2 uVSize; uniform float uMemory;
void main() {
  vec2 v = texture(uVel, vUv).xy;
  vec2 drift = uDrift * vec2(
    sin(vUv.y * 2.6 + 0.4) * sin(uTime * 0.047),
    0.6 * sin(vUv.x * 2.2 + 1.3) * sin(uTime * 0.039 + 1.7));
  // Memory: film eases back toward where it started, like elastic goo, so
  // endless stirring never folds everything into one muddy colour.
  vec2 home = (texture(uFilm, vUv).yz - vUv) * uVSize * uMemory;
  vec2 target = drift + home;
  v = target + (v - target) * uDamp;
  vec2 d = vUv - uMouse; d.x *= uAspect;
  float g = exp(-dot(d, d) / (uRadius * uRadius)) * uMouseOn;
  v = mix(v, uMouseVel, g * uPush);
  vec2 gd = vUv - uGhost; gd.x *= uAspect;
  v = mix(v, uGhostVel, exp(-dot(gd, gd) / (uGhostRadius * uGhostRadius)) * uGhostPush);
  o = vec4(v, 0.0, 1.0);
}`),

  // One Jacobi step of implicit viscous diffusion: (1 + 4a) v - a * sum(n) = v0
  viscous: program(`
uniform sampler2D uVel, uVel0; uniform vec2 uTexel; uniform float uAlpha;
void main() {
  vec2 s = texture(uVel, vUv + vec2(uTexel.x, 0)).xy + texture(uVel, vUv - vec2(uTexel.x, 0)).xy
         + texture(uVel, vUv + vec2(0, uTexel.y)).xy + texture(uVel, vUv - vec2(0, uTexel.y)).xy;
  o = vec4((texture(uVel0, vUv).xy + uAlpha * s) / (1.0 + 4.0 * uAlpha), 0.0, 1.0);
}`),

  divergence: program(`
uniform sampler2D uVel; uniform vec2 uTexel;
void main() {
  float r = texture(uVel, vUv + vec2(uTexel.x, 0)).x, l = texture(uVel, vUv - vec2(uTexel.x, 0)).x;
  float t = texture(uVel, vUv + vec2(0, uTexel.y)).y, b = texture(uVel, vUv - vec2(0, uTexel.y)).y;
  o = vec4(0.5 * (r - l + t - b), 0.0, 0.0, 1.0);
}`),

  pressure: program(`
uniform sampler2D uP, uDiv; uniform vec2 uTexel;
void main() {
  float s = texture(uP, vUv + vec2(uTexel.x, 0)).x + texture(uP, vUv - vec2(uTexel.x, 0)).x
          + texture(uP, vUv + vec2(0, uTexel.y)).x + texture(uP, vUv - vec2(0, uTexel.y)).x;
  o = vec4((s - texture(uDiv, vUv).x) * 0.25, 0.0, 0.0, 1.0);
}`),

  // Remove most, not all, of the divergence: the leftover squeezes and
  // stretches the film, which is what shifts its colours.
  project: program(`
uniform sampler2D uVel, uP; uniform vec2 uTexel; uniform float uKeep;
// How much the film may squeeze or stretch here: only right around a pushing
// cursor. Elsewhere (drift, the ghost push) the film just flows, colour intact.
uniform vec2 uMouse; uniform float uAspect, uPress, uPressRadius;
float pressMask(vec2 uv) {
  vec2 d = uv - uMouse; d.x *= uAspect;
  return uPress * exp(-dot(d, d) / (uPressRadius * uPressRadius));
}
void main() {
  float r = texture(uP, vUv + vec2(uTexel.x, 0)).x, l = texture(uP, vUv - vec2(uTexel.x, 0)).x;
  float t = texture(uP, vUv + vec2(0, uTexel.y)).x, b = texture(uP, vUv - vec2(0, uTexel.y)).x;
  vec2 v = texture(uVel, vUv).xy - (1.0 - uKeep * pressMask(vUv)) * 0.5 * vec2(r - l, t - b);
  o = vec4(v, 0.0, 1.0);
}`),

  // MacCormack step 1: plain semi-Lagrangian advection of whatever the film carries.
  advectFilm: program(`
uniform sampler2D uFilm, uVel; uniform vec2 uVTexel; uniform float uDt;
void main() {
  vec2 v = texture(uVel, vUv).xy;
  o = texture(uFilm, vUv - v * uDt * uVTexel);
}`),

  // MacCormack step 2: error-correct, clamp to the source neighbourhood so
  // bands stay crisp. Near a pushing cursor the squeeze (x) thins or
  // thickens the film with the flow; the starting position (yz) is just carried along.
  correctFilm: program(`
uniform sampler2D uFilm, uFwd, uVel; uniform vec2 uVTexel, uFTexel, uFSize; uniform float uDt, uCompress;
// How much the film may squeeze or stretch here: only right around a pushing
// cursor. Elsewhere (drift, the ghost push) the film just flows, colour intact.
uniform vec2 uMouse; uniform float uAspect, uPress, uPressRadius;
float pressMask(vec2 uv) {
  vec2 d = uv - uMouse; d.x *= uAspect;
  return uPress * exp(-dot(d, d) / (uPressRadius * uPressRadius));
}
void main() {
  vec2 v = texture(uVel, vUv).xy;
  vec4 fwd = texture(uFwd, vUv);
  vec4 back = texture(uFwd, vUv + v * uDt * uVTexel);
  vec4 h = fwd + 0.5 * (texture(uFilm, vUv) - back);
  vec2 p = (vUv - v * uDt * uVTexel) * uFSize - 0.5;
  ivec2 i = ivec2(floor(p));
  ivec2 m = ivec2(uFSize) - 1;
  vec4 a = texelFetch(uFilm, clamp(i, ivec2(0), m), 0);
  vec4 b = texelFetch(uFilm, clamp(i + ivec2(1, 0), ivec2(0), m), 0);
  vec4 c = texelFetch(uFilm, clamp(i + ivec2(0, 1), ivec2(0), m), 0);
  vec4 d = texelFetch(uFilm, clamp(i + ivec2(1, 1), ivec2(0), m), 0);
  h = clamp(h, min(min(a, b), min(c, d)), max(max(a, b), max(c, d)));

  float div = 0.5 * (texture(uVel, vUv + vec2(uVTexel.x, 0)).x - texture(uVel, vUv - vec2(uVTexel.x, 0)).x
                   + texture(uVel, vUv + vec2(0, uVTexel.y)).y - texture(uVel, vUv - vec2(0, uVTexel.y)).y);
  h.x *= mix(1.0, clamp(exp(-div * uDt), 0.75, 1.33), uCompress * pressMask(vUv));
  o = max(h, 0.0);
}`),

  // Piled-up or thinned film slowly settles back to the thickness it had.
  heal: program(`
uniform sampler2D uFilm; uniform float uRate;
void main() {
  vec4 f = texture(uFilm, vUv);
  f.x += (1.0 - f.x) * uRate;
  o = f;
}`),

  // The photo, read from wherever each bit of film started, plus how much the
  // thin-film colour has changed because the film was stretched or piled up.
  display: program(`
uniform sampler2D uFilm, uOrig, uPhoto, uLut, uLight;
uniform vec2 uFTexel, uScale, uOffset; uniform float uSpan, uBump, uGloss, uN;
vec3 toSrgb(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
float dh(vec2 uv) { vec3 f = texture(uFilm, uv).xyz; return texture(uOrig, f.yz).x * (f.x - 1.0); }
void main() {
  vec2 uv = vUv * uScale + uOffset;                 // cover-fit the film to the window
  vec3 film = texture(uFilm, uv).xyz;
  float h0 = texture(uOrig, film.yz).x;
  vec2 f = vec2(h0 * film.x, h0);                    // thickness now, and as it was in the photo
  vec2 e = uFTexel * 2.0;
  vec2 grad = vec2(dh(uv + vec2(e.x, 0)) - dh(uv - vec2(e.x, 0)),
                   dh(uv + vec2(0, e.y)) - dh(uv - vec2(0, e.y))) / 4.0;
  grad = clamp(grad * uBump * 0.01, -2.0, 2.0);
  vec3 n = normalize(vec3(-grad, 1.0));
  // A tilted surface sees light at an angle: the path through the film shortens.
  float cosT = sqrt(1.0 - (1.0 - n.z * n.z) / (uN * uN));
  vec3 now = texture(uLut, vec2(f.x * cosT / uSpan, 0.5)).rgb;
  vec3 was = texture(uLut, vec2(f.y / uSpan, 0.5)).rgb;
  vec3 light = texture(uLight, uv).rgb * 2.5;
  vec3 col = texture(uPhoto, film.yz).rgb + (now - was) * light;
  vec3 L = normalize(vec3(-0.45, 0.55, 1.0));
  vec3 Hh = normalize(L + vec3(0, 0, 1));
  float spec = max(pow(max(dot(n, Hh), 0.0), 40.0) - pow(Hh.z, 40.0), 0.0);
  col += uGloss * spec;
  o = vec4(toSrgb(col), 1.0);
}`),
};

// ---------------------------------------------------------------- resources
// Film positions need more precision than half floats give (about half a pixel).
const FILM_FORMAT = gl.getExtension('OES_texture_float_linear') ? gl.RGBA32F : gl.RGBA16F;
const film = pingpong(W, H, FILM_FORMAT);
const filmFwd = target(W, H, FILM_FORMAT);
const filmOrig = target(W, H);     // the thickness map as recovered from the photo
const photo = target(W, H);        // the photo, saturated, in linear colour
const vel = pingpong(VW, VH);
const vel0 = target(VW, VH);
const div = target(VW, VH);
const pres = pingpong(VW, VH);

const lutData = new Float32Array(DATA.lut.length * 4);
DATA.lut.forEach((c, i) => lutData.set([c[0], c[1], c[2], 1], i * 4));
const lutTex = texture(DATA.lut.length, 1, lutData);
const lightData = new Float32Array(DATA.lw * DATA.lh * 4);
for (let i = 0; i < DATA.lw * DATA.lh; i++) {
  lightData.set([DATA.illum[i * 3] / 2.5, DATA.illum[i * 3 + 1] / 2.5, DATA.illum[i * 3 + 2] / 2.5, 1], i * 4);
}
// Rows come top-down from the image; flip so v=0 is the bottom like the GL grids.
const lightFlipped = new Float32Array(lightData.length);
for (let y = 0; y < DATA.lh; y++) {
  lightFlipped.set(lightData.subarray((DATA.lh - 1 - y) * DATA.lw * 4, (DATA.lh - y) * DATA.lw * 4), y * DATA.lw * 4);
}
const lightTex = texture(DATA.lw, DATA.lh, lightFlipped);

let packedTex = null, photoTex = null;
function resetFilm() {
  run(P.decode, film.a, { uSqueeze: 1 }, { uPacked: packedTex });
  run(P.decode, filmOrig, { uSqueeze: 0 }, { uPacked: packedTex });
  run(P.decodePhoto, photo, { uSat: SATURATION }, { uPhoto: photoTex });
  for (const t of [vel.a, vel.b, pres.a, pres.b]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
}

// ---------------------------------------------------------------- input
const viscInput = document.getElementById('visc');
let visc = +viscInput.value;
viscInput.addEventListener('input', () => { visc = +viscInput.value; });
document.getElementById('reset').addEventListener('click', resetFilm);

// Screenshot: the film only (the buttons are HTML on top, so they're left out),
// at the canvas's full resolution. Browsers can't write to the Desktop directly:
// where supported (Chrome, Edge) a Save dialog opens already in Desktop;
// elsewhere, or inside another site's frame, it downloads as a normal file.
document.getElementById('shot').addEventListener('click', async () => {
  const d = new Date(), pad = (n) => String(n).padStart(2, '0');
  const name = `liquid-goo-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-` +
               `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
  draw();   // read the pixels straight after drawing, before the browser clears them
  const blob = new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  const download = async () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };
  if (!window.showSaveFilePicker) return download();
  try {
    const file = await window.showSaveFilePicker({
      suggestedName: name, startIn: 'desktop',
      types: [{ description: 'PNG image', accept: { 'image/png': ['.png'] } }],
    });
    const out = await file.createWritable();
    await out.write(await blob);
    await out.close();
  } catch (e) {
    if (e.name !== 'AbortError') download();   // cancelled: do nothing
  }
});

let view = { scale: [1, 1], offset: [0, 0] };
let pointer = null, pending = [0, 0], pointerUv = [0, 0], pointerOn = false;

function toFilmUv(x, y) {
  const r = canvas.getBoundingClientRect();
  const sx = (x - r.left) / r.width, sy = 1 - (y - r.top) / r.height;
  return [sx * view.scale[0] + view.offset[0], sy * view.scale[1] + view.offset[1]];
}
canvas.addEventListener('pointermove', (e) => {
  const uv = toFilmUv(e.clientX, e.clientY);
  if (pointer) { pending[0] += uv[0] - pointer[0]; pending[1] += uv[1] - pointer[1]; }
  pointer = uv; pointerUv = uv; pointerOn = true;
});
const leave = () => { pointer = null; pointerOn = false; };
canvas.addEventListener('pointerleave', leave);
canvas.addEventListener('pointercancel', leave);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  const ca = canvas.width / canvas.height, fa = W / H;
  view = ca > fa ? { scale: [1, fa / ca], offset: [0, (1 - fa / ca) / 2] }
                 : { scale: [ca / fa, 1], offset: [(1 - ca / fa) / 2, 0] };
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- loop
const lerp = (a, b, t) => a + (b - a) * t;
const vTexel = [1 / VW, 1 / VH], fTexel = [1 / W, 1 / H];
const DT = 1 / 60;
let time = 0, last = performance.now(), press = 0;
// The ghost push's path is re-rolled on every visit.
const rnd = (a, b) => a + Math.random() * (b - a);
const GHOST_PATH = { fx: rnd(0.08, 0.13), fy: rnd(0.055, 0.1), px: rnd(0, 2 * Math.PI), py: rnd(0, 2 * Math.PI),
                     ax: rnd(0.25, 0.36), ay: rnd(0.2, 0.3) };

function step(frameDt) {
  time += DT;
  // Slider: 0 = thin liquid (glides, light touch), 1 = thick goo (heavy, sheet-like).
  const damp = lerp(0.992, 0.9, visc);
  const alpha = lerp(0.05, 6.0, visc * visc);
  const push = lerp(0.85, 0.35, visc);

  run(P.advectVel, vel.b, { uTexel: vTexel, uDt: DT }, { uVel: vel.a.tex }); vel.swap();

  // pointer velocity in velocity cells per second
  const mv = [pending[0] * VW / frameDt, pending[1] * VH / frameDt];
  const cap = 900, m = Math.hypot(mv[0], mv[1]);
  if (m > cap) { mv[0] *= cap / m; mv[1] *= cap / m; }
  const moving = pointerOn && (pending[0] !== 0 || pending[1] !== 0);
  press = moving ? 1 : press * 0.9;   // squeezing fades out shortly after the cursor stops
  pending = [0, 0];
  // Ghost path: two slow sine sweeps at unrelated rates, so it wanders
  // back and forth across the film without ever circling.
  const g = GHOST_PATH, gt = time * GHOST_SPEED;
  const ghost = [0.5 + g.ax * Math.sin(gt * g.fx + g.px), 0.5 + g.ay * Math.sin(gt * g.fy + g.py)];
  const ghostVel = [g.ax * g.fx * GHOST_SPEED * Math.cos(gt * g.fx + g.px) * VW,
                    g.ay * g.fy * GHOST_SPEED * Math.cos(gt * g.fy + g.py) * VH];
  run(P.forces, vel.b, {
    uAspect: W / H, uRadius: PUSH_RADIUS, uPush: push, uDamp: damp, uTime: time,
    uDrift: DRIFT,
    uMouse: pointerUv, uMouseVel: mv, uMouseOn: moving ? 1 : 0,
    uGhost: ghost, uGhostVel: ghostVel, uGhostRadius: GHOST_RADIUS, uGhostPush: GHOST_PUSH,
    uVSize: [VW, VH], uMemory: MEMORY > 0 ? 1 / MEMORY : 0,
  }, { uVel: vel.a.tex, uFilm: film.a.tex }); vel.swap();

  // viscous diffusion (solve against the pre-diffusion field; dt 0 = copy)
  run(P.advectVel, vel0, { uTexel: vTexel, uDt: 0 }, { uVel: vel.a.tex });
  for (let i = 0; i < VISC_ITERS; i++) {
    run(P.viscous, vel.b, { uTexel: vTexel, uAlpha: alpha }, { uVel: vel.a.tex, uVel0: vel0.tex }); vel.swap();
  }

  run(P.divergence, div, { uTexel: vTexel }, { uVel: vel.a.tex });
  for (let i = 0; i < PRESSURE_ITERS; i++) {
    run(P.pressure, pres.b, { uTexel: vTexel }, { uP: pres.a.tex, uDiv: div.tex }); pres.swap();
  }
  const pressU = { uMouse: pointerUv, uAspect: W / H, uPress: press, uPressRadius: PUSH_RADIUS * 2.5 };
  run(P.project, vel.b, { uTexel: vTexel, uKeep: COMPRESSIBLE, ...pressU }, { uVel: vel.a.tex, uP: pres.a.tex }); vel.swap();

  run(P.advectFilm, filmFwd, { uVTexel: vTexel, uDt: DT }, { uFilm: film.a.tex, uVel: vel.a.tex });
  run(P.correctFilm, film.b, { uVTexel: vTexel, uFTexel: fTexel, uFSize: [W, H], uDt: DT, uCompress: 1, ...pressU },
      { uFilm: film.a.tex, uFwd: filmFwd.tex, uVel: vel.a.tex }); film.swap();
  run(P.heal, film.b, { uRate: HEAL > 0 ? DT / HEAL : 0 }, { uFilm: film.a.tex }); film.swap();
}

function draw() {
  run(P.display, null, {
    uFTexel: fTexel, uScale: view.scale, uOffset: view.offset, uSpan: DATA.span,
    uBump: BUMP, uGloss: GLOSS, uN: DATA.n,
  }, { uFilm: film.a.tex, uOrig: filmOrig.tex, uPhoto: photo.tex, uLut: lutTex, uLight: lightTex });
}

function frame(now) {
  const frameDt = Math.min(Math.max((now - last) / 1000, 1 / 240), 1 / 20);
  last = now;
  step(frameDt);
  draw();
  requestAnimationFrame(frame);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
Promise.all([loadImage('data:image/png;base64,' + DATA.png), loadImage('data:image/jpeg;base64,' + DATA.photo)])
  .then(([packed, pic]) => {
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    packedTex = texture(W, H, packed, gl.NEAREST, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    photoTex = texture(W, H, pic, gl.NEAREST, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    resetFilm();
    requestAnimationFrame(frame);
  })
  .catch(fail);
})();
</script>
